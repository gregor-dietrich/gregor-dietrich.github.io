baseURL: https://gregor-dietrich.github.io/
locale: en-us
title: Gregor Dietrich
theme: PaperMod

enableRobotsTXT: true
# Broken {{< ref >}} / {{< relref >}} links fail the build instead of warning.
refLinksErrorLevel: ERROR
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

params:
  env: production
  description: Essays and notes on software and whatever else.
  author: Gregor Dietrich
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  homeInfoParams:
    Title: Hi there
    Content: Short essays on software and whatever else is on my mind.
  socialIcons:
    - name: github
      url: https://github.com/gregor-dietrich
    - name: rss
      url: index.xml

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
