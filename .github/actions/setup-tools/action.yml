name: Set up tools
description: Installs Hugo and, optionally, the linters scripts/lint.sh runs, at pinned versions.

inputs:
  linters:
    description: Also install the linters (versions are pinned in scripts/install-linters.sh)
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      env:
        # Keep in step with `hugo version` locally (README.md, Maintenance).
        HUGO_VERSION: 0.167.0
      run: |
        curl -sSfL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
    - name: Install linters
      if: inputs.linters == 'true'
      shell: bash
      run: |
        scripts/install-linters.sh "$RUNNER_TEMP/tools"
        echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
