name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
    # Denylist, not an allowlist: anything not listed here still deploys.
    # Don't use '**.md' — posts are Markdown too.
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR at a time. A new push to a PR cancels its stale
# run; on main, an in-progress deploy finishes and newer runs queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The quality gate: nothing deploys unless it passes. PRs run only this job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          linters: "true"
      - name: Lint
        run: scripts/lint.sh

  build:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up tools
        uses: ./.github/actions/setup-tools
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "$BASE_URL/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
