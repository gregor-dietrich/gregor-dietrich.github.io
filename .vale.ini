StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Blog
Packages = proselint, write-good

[*.md]
BasedOnStyles = Vale, proselint, write-good
# Spelling is typos' job; Vale's dictionary flags every technical term.
Vale.Spelling = NO
# Flags every "is", "are" and "was" — noise for essays.
write-good.E-Prime = NO
